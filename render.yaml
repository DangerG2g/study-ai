services:
  - type: web
    name: study-ai
    runtime: python
    buildCommand: apt-get update && apt-get install -y libreoffice && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: STUDY_SECRET_KEY
        generateValue: true
