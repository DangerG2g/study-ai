<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password · Knowly</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="ambient"><i></i><i></i><i></i><span class="orb orb1"></span></div><div class="auth-page"><div class="auth-card"><div class="auth-brand">✦ Knowly</div><h1>Change password</h1><p>Update the password for your Knowly account.</p>{% if error %}<div class="auth-error">{{ error }}</div>{% endif %}{% if success %}<div class="auth-success">{{ success }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><label>New password<input type="password" name="new_password" autocomplete="new-password" minlength="8" required></label><label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required></label><button class="primary full" type="submit">Change password</button></form><div class="auth-footer"><a href="/">← Back to dashboard</a></div></div></div></body></html>
