<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Study AI</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="ambient"><i></i><i></i><i></i><span class="orb orb1"></span></div><div class="auth-page"><div class="auth-card"><div class="auth-brand">✦ Study<span>AI</span></div><h1>Create your account</h1><p>Your notes, chapters and study files stay separated from every other student.</p>{% if error %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="post"><label>Username<input name="username" autocomplete="username" placeholder="3–30 letters, numbers or _" required autofocus></label><label>Password<input type="password" name="password" autocomplete="new-password" placeholder="At least 8 characters" required></label><label>Confirm password<input type="password" name="password_confirm" autocomplete="new-password" required></label><button class="primary full" type="submit">Create account</button></form><div class="auth-footer">Already have an account? <a href="/login">Sign in</a></div></div></div></body></html>
