<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Study AI{% endblock %}</title><link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar">
<a class="brand" href="/"><span class="brand-icon">✦</span><span>Study<span>AI</span></span></a>
<nav>
<a class="nav-item" href="/"><span>⌂</span> Dashboard</a>
<a class="nav-item" href="/#subjects"><span>▣</span> My Subjects</a>
<a class="nav-item" href="/search"><span>⌕</span> Smart Search</a>
</nav>
<div class="sidebar-bottom"><div class="mini-card"><span class="mini-icon">✦</span><div><b>Study smarter</b><small>Keep everything in one place.</small></div></div></div>
</aside>
<section class="main-area">
<header class="topbar"><div class="mobile-brand"><a href="/">✦ StudyAI</a></div>
<form class="search" action="/search" method="get"><span>⌕</span><input name="q" value="{{ query|default('') }}" placeholder="Search your notes, PDFs and chapters..."><button type="submit">Search</button></form>
<div class="profile"><div class="avatar">S</div><div><b>Student</b><small>My workspace</small></div></div></header>
<main class="content">{% block content %}{% endblock %}</main></section></div>
<script>
function speakText(text){if(!('speechSynthesis'in window)){alert('Text-to-speech is not supported in this browser.');return;}speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text));}
function stopSpeaking(){if('speechSynthesis'in window)speechSynthesis.cancel();}
function openDialog(id){const d=document.getElementById(id);if(d)d.showModal();}
function filterChapterOptions(subjectId){document.querySelectorAll('#uploadChapter option[data-subject]').forEach(o=>o.hidden=subjectId && o.dataset.subject!==subjectId);document.querySelectorAll('#noteChapter option[data-subject]').forEach(o=>o.hidden=subjectId && o.dataset.subject!==subjectId);}
</script>
</body></html>
